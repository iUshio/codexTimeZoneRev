[package]
name = "codex_timezone_core"
version = "0.2.1"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
url = "2.5"

[target.'cfg(windows)'.dependencies]
quick-xml = "0.42"
windows = { version = "0.61.3", features = ["Management_Deployment", "ApplicationModel", "Storage", "Storage_Search", "Foundation_Collections", "Win32_Foundation", "Win32_Networking_WinHttp", "Win32_System_Com", "Win32_System_WinRT", "Win32_System_Threading", "Win32_System_RemoteDesktop", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
