[package]
name = "codextimezonerev"
version = "0.1.2"
description = "Codex 时区启动器"
authors = ["you"]
edition = "2021"

[lib]
name = "codextimezonerev_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
quick-xml = "0.42"
windows = { version = "0.61.3", features = ["Management_Deployment", "ApplicationModel", "Storage", "Storage_Search", "Foundation_Collections", "Win32_Foundation", "Win32_System_Com", "Win32_System_WinRT", "Win32_System_Threading", "Win32_System_RemoteDesktop", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
